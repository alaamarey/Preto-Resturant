          before:w-0
          before:h-[3px]
          before:rounded-none
          before:bg-[#AFBC72]
          before:absolute
          before:bottom-0
          before:start-0
          before:transition-width
          before:duration-1000
          hover:before:w-full
        "
        />

        <p-button
          label="Categroies"
          routerLink="/categroies"
          routerLinkActive=" active   before:bg-[#EFC46B] "

          plain

          before:h-[3px]
          before:bg-[#EFC46B]
          before:absolute
          before:bottom-0
          before:start-0
          before:transition-width
          before:duration-1000
          hover:before:w-full
        "
        />

          <p-button
            label="Cart"
            text
            plain
            [badge]="cartitemLength().length.toString() "
            icon=" pi pi-cart-arrow-down"
            size="large"
            routerLink="/cart"
            routerLinkActive="active   before:bg-[#ABA4C2] "
            styleClass="!text-[#ABA4C2] uppercase!  overflow-visible!
            before:w-0
            before:h-[3px]
            before:bg-[#ABA4C2]
            before:absolute
            before:bottom-0
            before:start-0
            before:transition-width
            before:duration-1000
            hover:before:w-full
          "
          />  
        

        <p-button
          label="The Experience"
          text
          plain
          routerLink="/experience"
          routerLinkActive=" active   before:bg-[#E36F62] "
          styleClass="!text-[#E36F62]  overflow-visible! 
          before:w-0
          before:h-[3px]
          before:bg-[#E36F62]
          before:absolute
          before:bottom-0
          before:start-0
          before:transition-width
          before:duration-1000
          hover:before:w-full"
         
        />

        <p-button
          label="Group Bookings"
          text
          plain
          routerLink="/group-booking"

        before:w-0
        before:h-[3px]

        before:start-0
        before:transition-width
        before:duration-1000
        hover:before:w-full"
        />

        label="Your Profile"
        text
        plain
        styleClass="!text-white  !bg-[#07B5C1]  !uppercase !rounded-none"

      />

</section>

  <ng-template pTemplate="center">

    </button>
  </ng-template>

<p-drawer [(visible)]="showMobileMenu" >
    <ul class="space-y-10 p-4 text-lg font-semibold text-center">

    <li routerLink="/experience" (click)="showMobileMenu = false" class="text-[#E36F62] uppercase cursor-pointer text-[25px] w-full  relative menu-items">The Experience</li>
    <li routerLink="/group-booking" (click)="showMobileMenu = false"  class="text-[#EFC66F] uppercase cursor-pointer  w-full text-[25px] relative menu-items">Group Booking</li>
    <li routerLink="/profile" (click)="showMobileMenu = false" class="text-[#07B5C1] uppercase w-full cursor-pointer text-[25px] relative menu-items">Your Profile</li>
  </ul>
</p-drawer>
